<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des Informations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h2>Étape 1/3 : Informations de Base du Devis</h2>
</div>

<div class="container">
    <form id="infoForm">
        
        <div style="display: flex; gap: 30px;">
            <div style="flex: 1;">
                <h3>Votre Structure (Entête du Devis)</h3>
                <div class="form-group"><label>Nom de Votre Société:</label><input type="text" id="ma_societe" value="Société Alpha Élec" required></div>
                <div class="form-group"><label>Adresse / Coordonnées:</label><input type="text" id="mon_adresse" value="123 Rue du Courant, Ville" required></div>
                <div class="form-group"><label>N° SIRET / Registre:</label><input type="text" id="mon_siret" value="00123456789" required></div>
            </div>

            <div style="flex: 1;">
                <h3>Client Final</h3>
                <div class="form-group"><label>Nom du Client:</label><input type="text" id="client_nom" value="Mme Dubois"></div>
                <div class="form-group"><label>Adresse du Chantier:</label><input type="text" id="client_adresse" value="456 Avenue des Roses"></div>
                <div class="form-group"><label>N° Devis:</label><input type="text" id="num_devis" value="DEV-2025-001"></div>
            </div>
        </div>

        <div class="app-controls">
            <h3>Estimation Main d'Œuvre (MO)</h3>
            <div style="display: flex; gap: 30px; align-items: flex-end;">
                <div class="form-group" style="flex: 1;"><label>Taux Horaire HT (F CFA):</label><input type="number" id="taux_horaire" value="5000" min="0"></div>
                <div class="form-group" style="flex: 1;"><label>Nombre d'Heures Estimées:</label><input type="number" id="nb_heures" value="10" min="0"></div>
                <div class="form-group" style="flex: 1;"><label>Coût Total MO (Calculé):</label><input type="text" id="total_mo" value="50 000 F CFA" readonly style="background-color: #f0f0f0;"></div>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: right;">
            <button type="submit" class="btn btn-success">Passer au Catalogue (Étape 2) &rarr;</button>
        </div>

    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', calculateMO);
    document.getElementById('taux_horaire').addEventListener('input', calculateMO);
    document.getElementById('nb_heures').addEventListener('input', calculateMO);
    
    function calculateMO() {
        const taux = parseFloat(document.getElementById('taux_horaire').value) || 0;
        const heures = parseFloat(document.getElementById('nb_heures').value) || 0;
        const total = taux * heures;
        document.getElementById('total_mo').value = total.toLocaleString('fr-FR') + ' F CFA';
    }

    document.getElementById('infoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Sauvegarde de toutes les infos du devis pour le récap
        localStorage.setItem('devis_info', JSON.stringify({
            societe: document.getElementById('ma_societe').value,
            adresse: document.getElementById('mon_adresse').value,
            siret: document.getElementById('mon_siret').value,
            client_nom: document.getElementById('client_nom').value,
            client_adresse: document.getElementById('client_adresse').value,
            num_devis: document.getElementById('num_devis').value,
            mo_total: parseFloat(document.getElementById('total_mo').value.replace(' F CFA', '').replace(/\s/g, '').replace(',', '.')) || 0 
        }));
        
        window.location.href = 'catalogue.html';
    });
</script>

</body>
</html>
